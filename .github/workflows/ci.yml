name: CI

on:
  push:
    branches: [ main ]
    # 문서만 바꾼 push 로 운영 서버를 재시작하지 않는다 (배포 = 약 10초 중단)
    paths-ignore: [ 'docs/**', '**.md' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4 # 운영(EC2 8.4.11)과 같은 계열. 8.0 은 2026-04 지원 종료
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: dotoree
          MYSQL_USER: dotoree_app
          MYSQL_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 17 설정
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 빌드 및 테스트
        env:
          DB_USERNAME: dotoree_app
          DB_PASSWORD: ci_test_password
          JWT_SECRET: ci_test_secret_key_for_github_actions_1234567890
        run: ./gradlew build

      - name: 실행 jar 를 artifact 로 올리기
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotoree-jar
          path: build/libs/*-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  # 게이트 — qa/test-*.sh 전부(192케이스)를 러너 안의 일회용 MySQL 에서 돌린다. 운영 DB 는 건드리지 않는다 (ADR-042)
  qa:
    needs: build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4 # 게이트는 운영과 같은 버전에서 통과해야 의미가 있다
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: dotoree
          MYSQL_USER: dotoree_app
          MYSQL_PASSWORD: ci_test_password
          TZ: Asia/Seoul # MySQL time_zone=SYSTEM 이 컨테이너 OS 를 따라간다 (ADR-026 타임존 3계층)
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # 러너는 UTC. 스크립트가 date 로 만드는 "오늘·내일"이 앱(JVM Asia/Seoul)과 어긋나면
      # 00~09시(KST)에 "미래 날짜 → 400" 케이스가 깨진다
      TZ: Asia/Seoul
      # 앱이 읽는 값 — 전부 일회용 컨테이너 값 (운영 값과 다르다)
      DB_USERNAME: dotoree_app
      DB_PASSWORD: ci_test_password
      JWT_SECRET: ci_test_secret_key_for_github_actions_1234567890
      # qa/_lib.sh 비대화 모드 (상단 주석)
      QA_PASSWORD: ci_qa_password_1
      QA_RESET: y
      QA_DB_HOST: 127.0.0.1
      QA_DB_USER: root
      QA_DB_PASSWORD: root_ci_password
      # 탈퇴 계정 파기 스케줄러를 2초마다 — test-withdraw.sh 가 파기까지 기다려 확인한다 (평소엔 매일 03:30, ADR-052)
      DOTOREE_PURGE_CRON: "*/2 * * * * *"
      QA_PURGE_FAST: "1"

    steps:
      - name: 소스코드 체크아웃 (qa 스크립트)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 17 설정
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      # 다시 빌드하지 않는다 — 검사한 그 jar 가 배포되는 jar
      - name: build 잡이 만든 jar 받기
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotoree-jar
          path: dist

      - name: 앱 기동 → 헬스 200 대기 (최대 90초)
        run: |
          nohup java -jar dist/*-SNAPSHOT.jar > app.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8080/actuator/health || true)
            if [ "$code" = "200" ]; then echo "healthy after ${i} tries"; exit 0; fi
            sleep 3
          done
          echo "앱이 뜨지 않았습니다 — 마지막 응답: ${code}"
          exit 1

      # 계정 목록은 reset-all.sh 한 곳에만 있다. 가입을 API 로 해야 '미분류' E/I 가 생긴다
      - name: 테스트 계정 시드
        run: bash qa/reset-all.sh

      - name: 회귀 (qa/test-*.sh 전부)
        run: |
          # 하나가 실패해도 나머지를 끝까지 돌린다 — 한 번의 실행에서 깨진 곳을 전부 본다
          failed=""
          for f in qa/test-*.sh; do
            echo "::group::$f"
            bash "$f" || failed="$failed $f"
            echo "::endgroup::"
          done
          # 접힌 그룹을 열지 않아도 어디가 깨졌는지 보이게
          if [ -n "$failed" ]; then echo "❌ 실패한 스크립트:$failed"; exit 1; fi
          echo "✅ 스크립트 전부 통과"

      - name: 실패 시 앱 로그
        if: failure()
        run: tail -n 200 app.log

  deploy:
    # qa 가 실패하면 배포하지 않는다 — 게이트 (ADR-042 ②). build 도 남겨 둔다: jar artifact 를 만든 잡
    needs: [build, qa]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # OIDC 토큰 발급에 id-token: write 가 필요하다. 나머지는 읽기만
    permissions:
      id-token: write
      contents: read

    # 배포가 겹치면 보안 그룹 규칙을 서로 지운다. 한 번에 하나씩, 취소하지 않고 대기
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    env:
      AWS_REGION: ap-northeast-2
      EC2_USER: deploy

    steps:
      - name: build 잡이 만든 jar 받기
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotoree-jar
          path: dist

      - name: AWS 임시 자격 받기 (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 러너 공인 IP 확인
        id: runner_ip
        run: |
          IP=$(curl -s --max-time 10 https://checkip.amazonaws.com || curl -s --max-time 10 https://api.ipify.org)
          IP=$(echo "$IP" | tr -d '[:space:]')
          [ -n "$IP" ] || { echo "러너의 공인 IP를 알아내지 못했습니다"; exit 1; }
          echo "::add-mask::$IP"
          echo "cidr=${IP}/32" >> "$GITHUB_OUTPUT"

      - name: 22번을 러너 IP 에만 열기
        run: |
          # 이전 실행이 강제 종료돼 규칙이 남아 있을 수 있다. 먼저 지우고 연다(자기 정리)
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.AWS_SG_ID }}" \
            --protocol tcp --port 22 --cidr "${{ steps.runner_ip.outputs.cidr }}" 2>/dev/null || true
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.AWS_SG_ID }}" \
            --protocol tcp --port 22 --cidr "${{ steps.runner_ip.outputs.cidr }}"

      - name: 배포 키 · 서버 지문 파일 만들기
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/dotoree_deploy
          chmod 600 ~/.ssh/dotoree_deploy
          # 서버 지문을 미리 적어 둔다. 러너는 매번 새 머신이라 accept-new 는 사실상 검증이 없다.
          # 지문이 다르면(가짜 서버·중간자) SSH 가 접속을 거부한다. 서버를 새로 만들면 EC2_HOST_KEY 도 갱신
          printf '%s %s\n' "${{ secrets.EC2_HOST }}" "${{ secrets.EC2_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # 지문 형식을 여기서 검사한다 — 형식이 틀리면 ssh 는 그 줄을 조용히 무시하고
          # "No ED25519 host key is known" 이라고만 해서 원인이 안 보인다 (2026-09-20 실제로 겪음)
          KEY='${{ secrets.EC2_HOST_KEY }}'
          if ! ssh-keygen -l -f ~/.ssh/known_hosts > /dev/null 2>&1; then
            echo "EC2_HOST_KEY 형식이 올바르지 않습니다 — 길이 ${#KEY} (정상 80), 앞 11글자 '${KEY:0:11}' (정상 ssh-ed25519)"
            exit 1
          fi

      - name: jar 전송 → 교체 → 재시작
        run: |
          SSH="ssh -i ~/.ssh/dotoree_deploy -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          scp -i ~/.ssh/dotoree_deploy -o StrictHostKeyChecking=yes \
            dist/*-SNAPSHOT.jar "${EC2_USER}@${{ secrets.EC2_HOST }}:/opt/dotoree/dotoree.jar.new"
          # sudoers 는 문자열 그대로 매칭이라 `sudo systemctl restart dotoree` 를 정확히 이 형태로
          $SSH "${EC2_USER}@${{ secrets.EC2_HOST }}" \
            'set -e
             # 롤백용 — 덮어쓰기 전에 지금 돌고 있는 jar 를 남긴다 (복구: cp dotoree.jar.prev dotoree.jar 후 restart)
             if [ -f /opt/dotoree/dotoree.jar ]; then cp -p /opt/dotoree/dotoree.jar /opt/dotoree/dotoree.jar.prev; fi
             mv /opt/dotoree/dotoree.jar.new /opt/dotoree/dotoree.jar
             sudo systemctl restart dotoree'

      - name: 헬스 200 대기 (최대 90초)
        run: |
          # Type=simple 이라 systemctl 의 active 는 "프로세스가 떴다" 까지다(3-3 실측).
          # 8080 은 밖에 열려 있지 않으므로 서버 안에서 localhost 로 확인한다
          ssh -i ~/.ssh/dotoree_deploy -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "${EC2_USER}@${{ secrets.EC2_HOST }}" \
            'for i in $(seq 1 30); do
               code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8080/actuator/health || true)
               if [ "$code" = "200" ]; then echo "healthy after ${i} tries"; exit 0; fi
               sleep 3
             done
             echo "헬스 체크 실패 — 마지막 응답: ${code}"
             journalctl -u dotoree -n 50 --no-pager
             exit 1'

      - name: 22번 닫기
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.AWS_SG_ID }}" \
            --protocol tcp --port 22 --cidr "${{ steps.runner_ip.outputs.cidr }}" 2>/dev/null || true
