<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>반복</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/util/theme.js"></script>
</head>
<body>
    <div class="page-container">
        <a href="/views/personal/settings.html" class="inline-link">← 설정</a>
        <h1>반복</h1>
        <nav class="sub-nav">
            <a href="/views/personal/personal-main.html">가계부</a>
            <a href="/views/personal/account.html">계좌</a>
            <a href="/views/personal/statistics.html">통계</a>
            <a href="/views/personal/settings.html" class="active">설정</a>
        </nav>

        <!-- 반복 예정 (욕조 ② — ADR-067). 규칙만 적어 두면 그날 가계부에 "예정"이 뜨고, [확인]을 눌러야 거래 · 이체가 생긴다 -->
        <p class="form-hint">월세 · 월급 · 카드값처럼 매달(매년) 같은 돈을 적어 두면, 그날 가계부 맨 위에 예정으로 떠요. [확인]을 누르면 기록되고, 금액이 다르면 그때 고치면 돼요. 다음 달 말까지 계좌가 모자라는 날이 있으면 계좌 화면 맨 위에 알려 줘요.</p>

        <button id="addBtn">+ 반복 추가</button>
        <ul id="ruleList"></ul>
        <p id="emptyMessage" hidden>아직 반복이 없어요.</p>
    </div>

    <div id="ruleModal" class="modal-overlay" hidden>
        <div class="modal">
            <h2 id="modalTitle">반복 추가</h2>
            <form id="ruleForm" class="form-container">
                <div class="tabs">
                    <button type="button" class="tab active" data-type="E">지출</button>
                    <button type="button" class="tab" data-type="I">수입</button>
                    <button type="button" class="tab" data-type="T">이체</button>
                </div>

                <div id="transactionFields">
                    <label>카테고리 <select id="categoryNum"></select></label>
                    <label>계좌 <select id="accountNum"></select></label>
                </div>
                <div id="transferFields" hidden>
                    <label>보내는 계좌 <select id="fromAccountNum"></select></label>
                    <label>받는 계좌 <select id="toAccountNum"></select></label>
                </div>

                <label>금액 (평소 금액) <input type="number" id="ruleAmount" min="1" max="1000000000000" required></label>

                <label>주기
                    <select id="repeatType">
                        <option value="M">매달</option>
                        <option value="Y">매년</option>
                    </select>
                </label>
                <label id="repeatMonthField" hidden>달
                    <select id="repeatMonth"></select>
                </label>
                <label>날짜(일)
                    <select id="repeatDay"></select>
                </label>
                <p class="form-hint">31일을 고르면 30일까지인 달엔 30일, 2월엔 28·29일에 떠요. 주말이어도 그날 그대로 떠요.</p>

                <!-- 시작 날짜 · 끝 날짜 · 메모는 "더 보기"로 접는다(10/29). 시작 날짜는 오늘이 기본값이라 접어 둬도 비지 않는다. 수정할 땐 펼쳐 둔다 -->
                <details id="ruleMore" class="more-fields">
                    <summary>더 보기 <small>시작 날짜 · 끝 날짜 · 메모</small></summary>
                    <label>시작 날짜 <input type="date" id="startDate" required></label>
                    <label>끝 날짜 (할부면 마지막 달, 비우면 계속) <input type="date" id="endDate"></label>
                    <label>메모 <input type="text" id="ruleMemo" maxlength="100"></label>
                </details>

                <button type="submit" id="submitBtn">저장</button>
                <button type="button" id="cancelBtn">취소</button>
                <p id="resultMessage" class="result-message"></p>
            </form>
        </div>
    </div>

    <script src="/js/util/authGuard.js"></script>
    <script src="/js/util/apiClient.js"></script>
    <script src="/js/util/format.js"></script>
    <script src="/js/util/buttonUtil.js"></script>
    <script src="/js/personal/recurring.js"></script>
</body>
</html>
