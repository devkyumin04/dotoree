<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>개인 가계부</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/util/theme.js"></script>
</head>
<body>
    <div class="page-container">
        <a href="/views/main.html" class="inline-link">← 메인</a>
        <h1>개인 가계부</h1>

        <nav class="sub-nav">
            <a href="/views/personal/personal-main.html" class="active">가계부</a>
            <a href="/views/personal/account.html">계좌</a>
            <a href="/views/personal/recurring.html">반복</a>
            <a href="/views/personal/category.html">카테고리</a>
            <a href="/views/personal/statistics.html">통계</a>
        </nav>

        <!-- 월 선택 -->
        <div class="month-nav">
            <button type="button" id="prevMonth">◀</button>
            <span id="monthLabel"></span>
            <button type="button" id="nextMonth">▶</button>
        </div>

        <!-- 월 합계 -->
        <div class="summary">
            <span>수입 <b id="sumIncome" class="amount-income">0</b></span>
            <span>지출 <b id="sumExpense" class="amount-expense">0</b></span>
            <span>이번 달 증감 <small>(수입 − 지출)</small> <b id="sumBalance">0</b></span>
        </div>

        <!-- 반복 예정 (욕조 ② — ADR-067) — 이번 달 남은 예정 + 밀린 예정. [확인]해야 거래 · 이체가 생긴다. 이번 달을 볼 때만 -->
        <section id="pendingSection" hidden>
            <h2 class="pending-title">예정 <small><a class="inline-link" href="/views/personal/recurring.html">반복 관리</a></small></h2>
            <ul id="pendingList"></ul>
        </section>

        <button id="addBtn">+ 추가</button>

        <p id="countList"></p>

        <ul id="transactionList"></ul>
        <p id="emptyMessage" hidden>이 달에는 내역이 없습니다.</p>
    </div>

    <!-- 모달 -->
    <div id="transactionModal" class="modal-overlay" hidden>
        <div class="modal">
            <h2 id="modalTitle">거래 추가</h2>
            <form id="transactionForm" class="form-container">
                <!-- 지출/수입 타입은 서버로 보내지 않는다 (카테고리에서 파생 — ADR-008).
                     지출/수입은 카테고리 목록을 거르는 화면 전용 토글, 이체는 다른 API(/api/transfers) — ADR-065 -->
                <div class="tabs">
                    <button type="button" class="tab active" data-type="E">지출</button>
                    <button type="button" class="tab" data-type="I">수입</button>
                    <button type="button" class="tab" data-type="T">이체</button>
                </div>

                <!-- 칸 순서(10/28): 금액 → 카테고리 → 날짜 → 메모 → 계좌. 계좌는 거의 안 바꾸니 맨 끝(마지막에 쓴 계좌가 기본).
                     계좌가 하나뿐이면 계좌 칸 · 이체 탭은 숨긴다(고를 게 없다) -->
                <label>금액
                    <input type="number" id="transAmount" min="1" max="1000000000000" required>
                </label>
                <div id="transactionFields">
                    <label>카테고리
                        <select id="categoryNum"></select>
                    </label>
                </div>
                <!-- 이체 — 계좌 사이에서 돈이 자리만 옮긴다(수입·지출 아님, 월 합계에 안 들어감). 카드값 내기 = 통장 → 카드 -->
                <div id="transferFields" hidden>
                    <label>보내는 계좌
                        <select id="fromAccountNum"></select>
                    </label>
                    <label>받는 계좌
                        <select id="toAccountNum"></select>
                    </label>
                </div>
                <label>날짜
                    <input type="date" id="transDate" required>  <!-- max 는 JS 가 오늘로 설정 -->
                </label>
                <label>메모
                    <input type="text" id="transMemo" maxlength="100">
                </label>
                <label id="accountField">계좌
                    <select id="accountNum"></select>
                </label>

                <button type="submit" id="submitBtn">저장</button>
                <button type="button" id="cancelBtn">취소</button>
                <button type="button" id="deleteBtn" class="btn-danger" hidden>삭제</button>

                <!-- 모달이 오버레이 위에 뜨므로 에러 메시지도 모달 안에 있어야 보인다 -->
                <p id="resultMessage" class="result-message"></p>
            </form>
        </div>
    </div>

    <!-- 예정 확인 — 실제 금액 · 날짜로 고칠 수 있다(카드값은 달마다 다르고, 주말이면 하루 이틀 다르다) -->
    <div id="confirmModal" class="modal-overlay" hidden>
        <div class="modal">
            <h2>예정 확인</h2>
            <form id="confirmForm" class="form-container">
                <p class="form-hint" id="confirmHint"></p>
                <label>금액 <input type="number" id="confirmAmount" min="1" max="1000000000000" required></label>
                <label>날짜 <input type="date" id="confirmDate" required></label>
                <button type="submit" id="confirmSubmitBtn">기록하기</button>
                <button type="button" id="confirmCancelBtn">취소</button>
                <p id="confirmMessage" class="result-message"></p>
            </form>
        </div>
    </div>

    <script src="/js/util/authGuard.js"></script>
    <script src="/js/util/apiClient.js"></script>
    <script src="/js/util/format.js"></script>
    <script src="/js/util/buttonUtil.js"></script>
    <script src="/js/personal/transaction.js"></script>
</body>
</html>
