<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>개인 통계</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/util/theme.js"></script>
</head>
<body>
    <div class="page-container">
        <a href="/views/main.html" class="inline-link">← 메인</a>
        <h1>개인 통계</h1>

        <nav class="sub-nav">
            <a href="/views/personal/personal-main.html">가계부</a>
            <a href="/views/personal/category.html">카테고리</a>
            <a href="/views/personal/statistics.html" class="active">통계</a>
        </nav>

        <!-- 월 선택 -->
        <div class="month-nav">
            <button type="button" id="prevMonth">◀</button>
            <span id="monthLabel"></span>
            <button type="button" id="nextMonth">▶</button>
        </div>

        <!-- 요약 4개 — 전부 서버 값 그대로 (ADR-038). savingsRate(저축률) null 은 '-'
             "이번 달 증감"은 기록 기준(수입 − 지출) — 계좌 기준 순자산 변화와 다를 수 있어 부제로 구분 (ADR-065) -->
        <div class="summary stat-summary">
            <span>수입 <b id="totalIncome" class="amount-income">0</b></span>
            <span>지출 <b id="totalExpense" class="amount-expense">0</b></span>
            <span>이번 달 증감 <small>(수입 − 지출)</small> <b id="balance">0</b></span>
            <span>저축률 <b id="savingsRate">-</b></span>
        </div>

        <!-- 봉투 목록 — 대분류 펼치면 소분류. 자식 비율은 부모 대비 (ADR-039) -->
        <h2>지출</h2>
        <div id="expenseList"></div>
        <p id="expenseEmpty" hidden>지출 내역이 없습니다.</p>

        <h2>수입</h2>
        <div id="incomeList"></div>
        <p id="incomeEmpty" hidden>수입 내역이 없습니다.</p>

        <!-- 6개월 추이 — 보는 달 포함 롤링 6개, 빈 달은 서버가 0 으로 채움 -->
        <h2>6개월 추이</h2>
        <div id="monthlyList" class="trend-list"></div>
    </div>

    <script src="/js/util/authGuard.js"></script>
    <script src="/js/util/apiClient.js"></script>
    <script src="/js/util/format.js"></script>
    <script src="/js/personal/statistics.js"></script>
</body>
</html>
