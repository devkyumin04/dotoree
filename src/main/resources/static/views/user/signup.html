<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 — 도토리</title>
	<link rel="stylesheet" href="/css/common.css">
	<script src="/js/util/theme.js"></script>
</head>
<body>
    <div class="page-container">
        <a href="/views/main.html" class="inline-link">← 메인</a>
        <h1>회원가입</h1>
    </div>

    <section class="form-section">
        <form id="signupForm" class="form-container">
            <label for="email">이메일</label>
            <input type="email" id="email" maxlength="100" required>
            <button type="button" id="codeBtn">인증 코드 받기</button>
            <p id="codeMessage" class="form-help" hidden></p>

            <label for="code">인증 코드</label>
            <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="메일로 받은 숫자 6자리" required>

            <label for="password">비밀번호</label>
            <input type="password" id="password" minlength="8" maxlength="20" required>

            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" maxlength="20" required>

            <label class="form-check">
                <input type="checkbox" id="ageCheck" required>
                만 14세 이상입니다
            </label>
            <p class="form-help">가입하면 <a href="/views/privacy.html" class="inline-link">개인정보 처리방침</a>에 따라 이메일·닉네임을 처리합니다.</p>

            <button type="submit" id="submitBtn">가입하기</button>
        </form>
        <div id="resultMessage" class="result-message"></div>
        <p class="form-help">이미 계정이 있으신가요? <a href="/views/user/login.html" class="inline-link">로그인</a></p>
    </section>

    <footer class="site-footer">
        <a href="/views/privacy.html" class="inline-link">개인정보 처리방침</a>
        <a href="mailto:support@dotoree.app" class="inline-link">support@dotoree.app</a>
    </footer>

    <script src="/js/util/apiClient.js"></script>
    <script src="/js/util/buttonUtil.js"></script>
    <script src="/js/util/emailCode.js"></script>
    <script src="/js/user/signup.js"></script>
</body>
</html>
