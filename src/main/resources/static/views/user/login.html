<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 — 도토리</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/util/theme.js"></script>
</head>
<body>
    <div class="page-container">
        <a href="/views/main.html" class="inline-link">← 메인</a>
        <h1>로그인</h1>
    </div>

    <section class="form-section">
        <form id="loginForm" class="form-container">
            <label for="email">이메일</label>
            <input type="email" id="email" required>

            <label for="password">비밀번호</label>
            <input type="password" id="password" required>

            <button type="submit" id="submitBtn">로그인</button>
        </form>
        <div id="resultMessage" class="result-message"></div>
        <p class="form-help">가입 없이 먼저 구경해 보고 싶으신가요? 미리 채워 둔 예시 가계부를 볼 수 있어요(보기만 가능).</p>
        <button type="button" id="demoBtn">데모로 둘러보기</button>
        <p class="form-help">계정이 없으신가요? <a href="/views/user/signup.html" class="inline-link">회원가입</a></p>
        <p class="form-help">비밀번호를 잊으셨나요? <a href="/views/user/password-reset.html" class="inline-link">비밀번호 재설정</a></p>
    </section>

    <footer class="site-footer">
        <a href="/views/privacy.html" class="inline-link">개인정보 처리방침</a>
        <a href="mailto:support@dotoree.app" class="inline-link">support@dotoree.app</a>
    </footer>
	
	<script src="/js/util/apiClient.js"></script>
	<script src="/js/util/buttonUtil.js"></script>
	<script src="/js/user/login.js"></script>
</body>
</html>
