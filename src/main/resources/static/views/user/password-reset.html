<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 재설정 — 도토리</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/util/theme.js"></script>
</head>
<body>
    <div class="page-container">
        <a href="/views/user/login.html" class="inline-link">← 로그인</a>
        <h1>비밀번호 재설정</h1>
    </div>

    <section class="form-section">
        <form id="resetForm" class="form-container">
            <label for="email">가입한 이메일</label>
            <input type="email" id="email" maxlength="100" required>
            <button type="button" id="codeBtn">인증 코드 받기</button>
            <p id="codeMessage" class="form-help" hidden></p>

            <label for="code">인증 코드</label>
            <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="메일로 받은 숫자 6자리" required>

            <label for="newPassword">새 비밀번호</label>
            <input type="password" id="newPassword" minlength="8" maxlength="20" autocomplete="new-password" required>
            <p class="form-help">바꾸면 모든 기기에서 로그아웃되고, 로그인 잠금도 풀립니다.</p>

            <button type="submit" id="submitBtn">비밀번호 바꾸기</button>
        </form>
        <div id="resultMessage" class="result-message"></div>
    </section>

    <footer class="site-footer">
        <a href="/views/privacy.html" class="inline-link">개인정보 처리방침</a>
        <a href="mailto:support@dotoree.app" class="inline-link">support@dotoree.app</a>
    </footer>

    <script src="/js/util/apiClient.js"></script>
    <script src="/js/util/buttonUtil.js"></script>
    <script src="/js/util/emailCode.js"></script>
    <script src="/js/user/password-reset.js"></script>
</body>
</html>
