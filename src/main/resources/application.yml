spring:
  application:
    name: dotoree

  datasource:
    url: jdbc:mysql://localhost:3306/dotoree #local, github actions, ec2 전부 각 컴퓨터 자신의 MySQL을 가리키므로 환경변수 처리 제외
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  forward-headers-strategy: native #Nginx 가 붙인 X-Forwarded-Proto/For 를 믿는다(127.0.0.1·사설 IP 에서 온 것만). 프록시 없는 로컬·CI 에선 헤더가 안 와서 효과 없음

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 15m      # Duration 표기 (15m · 14d). 자바는 Duration 으로 받는다
  refresh-token-expiration: 14d     # DB EXPIRES_AT 과 쿠키 Max-Age 가 같이 쓴다 (ADR-055)

dotoree:
  purge:
    cron: "0 30 3 * * *" # 탈퇴 계정 파기 — 매일 03:30 KST, 04:00 백업 전 (ADR-052). 환경변수 DOTOREE_PURGE_CRON 으로 덮을 수 있다
  auth-cleanup:
    cron: "0 40 3 * * *" # 하루 지난 인증 코드 · 만료 Refresh 정리 — 매일 03:40 KST, 파기 뒤 · 백업 전 (ADR-068). DOTOREE_AUTHCLEANUP_CRON 으로 덮을 수 있다
  mail:
    sender: ses # ses(운영 — 인스턴스 역할로 SES 발송) · log(로컬 — 콘솔에 찍기). 그 밖의 값은 기동 실패 (MailConfig, ADR-068)
    region: ap-northeast-2 # SES 프로덕션 액세스는 리전마다 따로 — 승인받은 서울
    from: "dotoree <no-reply@dotoree.app>" # 인증된 도메인의 주소. 받는 메일함은 없다(답장은 support@)
